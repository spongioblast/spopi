name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HTTP_CHECK_REVOKE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Fetch Pi
        run: bun run fetch:pi

      - name: Fetch agent-browser binary
        run: bun run fetch:agent-browser

      - name: Build extensions
        run: bun run build:extensions

      - name: Build frontend
        run: bun run build:frontend

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Rust
        run: bun run check:rust

      - name: Streaming smoke
        run: bun run smoke:stream

      - name: Host streaming smoke
        run: bun run smoke:stream -- --host
