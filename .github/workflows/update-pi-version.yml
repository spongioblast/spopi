name: Check pi updates

# Opens an issue when Pi publishes a release newer than scripts/pi-version.json.
# The bump itself is local and reviewed: bun run bump:pi <version> (docs/PI_BUMP.md).

on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Open an issue for a new Pi release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE=$(gh api repos/earendil-works/pi/releases/latest)
          LATEST=$(echo "$RELEASE" | jq -r '.tag_name // empty' | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            echo "::error::Could not read the latest Pi release"
            exit 1
          fi
          CURRENT=$(jq -r '.version' scripts/pi-version.json)
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Pi is up to date at v$CURRENT."
            exit 0
          fi

          TITLE="Pi v${LATEST} available"
          if gh issue list --state open --search "\"${TITLE}\" in:title" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "An open issue already tracks v${LATEST}."
            exit 0
          fi

          {
            echo "Pi released [v${LATEST}](https://github.com/earendil-works/pi/releases/tag/v${LATEST}). SPOPI bundles v${CURRENT}."
            echo
            echo "Read the notes, then run \`bun run bump:pi ${LATEST}\` and follow [docs/PI_BUMP.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/PI_BUMP.md)."
            echo
            echo "## Release notes"
            echo
            echo "$RELEASE" | jq -r '.body // "No release notes."'
          } > /tmp/issue.md
          gh issue create --title "$TITLE" --body-file /tmp/issue.md
